<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7d9e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rosé Planner">
<link rel="manifest" href="manifest.webmanifest">
<title>Rosé Planner</title>
<style>
:root{--pink:#d96f9c;--pink2:#f7d9e5;--pale:#fff7fa;--ink:#40343b;--muted:#8c7b84;--line:#f0e3e9;--white:#fff;--green:#5f9b83;--shadow:0 8px 28px #8c456014}
*{box-sizing:border-box}body{margin:0;background:#fffafd;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#fffafdF2;backdrop-filter:blur(12px);padding:16px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;font-size:25px;color:#b9517f}.sub{font-size:12px;color:var(--muted);margin-top:3px}.today{font-size:12px;color:var(--muted);text-align:right}
nav{display:flex;gap:7px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}nav button{border:0;background:#f8edf2;color:#876b79;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:13px}nav button.active{background:var(--pink);color:white}
main{max-width:1000px;margin:auto;padding:18px 15px 100px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading{font:24px Georgia,serif;margin:8px 0 4px}.muted{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--pale);border-radius:15px;padding:13px}.stat strong{display:block;font-size:22px;color:#b9517f}.stat span{font-size:11px;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:#f4e8ed;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#e79abb,#c75c8a);border-radius:99px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--pink);color:#fff;font-weight:600}.btn.secondary{background:#f8edf2;color:#9a5272}.btn.ghost{background:white;color:#9a5272;border:1px solid var(--line)}.btn.small{padding:7px 10px;font-size:12px}.btn.danger{background:#fff0f2;color:#b54b65}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f5edf1}.task:last-child{border:0}.task input{width:19px;height:19px;accent-color:var(--pink)}.task.done .taskname{text-decoration:line-through;color:#a99aa1}.taskname{font-weight:600}.taskmeta{font-size:12px;color:var(--muted);margin-top:4px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#f8edf2;color:#9c5d79;margin-right:4px}.priority-fixed{background:#fff0ee;color:#b65a52}.priority-important{background:#fff5df;color:#99702e}.priority-optional{background:#f0edf8;color:#78679e}
.timeline{border-left:2px solid #f1d9e4;margin:12px 0 4px 8px;padding-left:17px}.slot{position:relative;padding:0 0 17px}.slot:before{content:"";position:absolute;left:-23px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--pink);border:2px solid white;box-shadow:0 0 0 2px #f1d9e4}.slot time{font-size:11px;color:var(--muted)}.slot .event{margin-top:4px;padding:10px 12px;border-radius:12px;background:#fff4f8;border-left:4px solid var(--pink)}.event small{display:block;color:var(--muted);margin-top:3px}
.gridcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.daycell{min-height:76px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px;font-size:12px;overflow:hidden}.daycell.out{opacity:.35}.daycell.selected{outline:2px solid var(--pink)}.daynum{font-weight:700}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:3px 2px 0 0}.daylabel{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.listline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.listline:last-child{border:0}
.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--ink)}.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.checks label{display:flex;align-items:center;gap:6px}.checks input{width:auto}
.modal{position:fixed;inset:0;background:#39212d66;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffafd;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));}.sheet h2{font:23px Georgia,serif;margin:0 0 12px}.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekcol{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;min-height:120px}.weekcol b{font-size:12px}.weekitem{font-size:10px;background:#fff2f7;padding:5px;border-radius:7px;margin-top:5px;overflow-wrap:anywhere}
footer{position:fixed;bottom:0;left:0;right:0;padding:9px 15px calc(9px + env(safe-area-inset-bottom));background:#fffafdF2;border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;z-index:4}
@media(min-width:700px){main{padding:25px 24px 100px}.daycell{min-height:100px}.modal{align-items:center}.sheet{border-radius:22px}.weekcol{min-height:180px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">Rosé Planner ♡</div><div class="sub">Une journée à la fois, avec douceur.</div></div><div class="today" id="headerDate"></div></div>
<nav id="nav">
<button data-view="day" class="active">Journée</button><button data-view="week">Semaine</button><button data-view="month">Mois</button><button data-view="year">Année</button><button data-view="review">Bilan</button><button data-view="goals">Objectifs</button>
</nav></header>
<main id="app"></main>
<footer><button class="btn" onclick="openTask()">＋ Ajouter</button><button class="btn secondary" onclick="exportData()">Sauvegarder</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">Importer une sauvegarde</button><button class="btn secondary" onclick="openPhotoImport()">Importer une photo</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)"><input id="photoFile" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/*" onchange="readSchedulePhoto(event)" style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0"></footer>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const CATS=['Anglais','1314 – Enzymologie et métabolisme','1316 – Microbiologie','1317 – Physiologie cellulaire','1318 – Physiologie végétale','1319 – Biotechnologie alimentaire','Cours supplémentaires','Révisions','Temps libre','TEDS','Rendez-vous','Autre'];
const COLORS=['#d96f9c','#d69a58','#7c9eae','#9b83bd','#78a68b','#cf7c74','#8e9cae','#b77a9b','#a9b7a8','#7d91c1','#c28b63','#9c8d94'];
const GOALS=[
{id:'en',name:'Anglais',hours:1,until:'2026-11-26'},
{id:'1314',name:'1314 – Enzymologie et métabolisme',hours:5,until:'2026-12-14'},
{id:'1316',name:'1316 – Microbiologie',hours:5,until:'2026-12-15'},
{id:'1317',name:'1317 – Physiologie cellulaire',hours:5,until:'2026-12-14'},
{id:'1318',name:'1318 – Physiologie végétale',hours:5,until:'2026-12-15'},
{id:'1319',name:'1319 – Biotechnologie alimentaire',hours:5,until:'2026-12-16'},
{id:'teds',name:'TEDS',hours:2.5,until:'2026-12-17'}
];
const EXAMS=[
['Examen d’anglais','2026-11-26','','','Anglais'],
['Débat noté – Biotechnologie alimentaire','2026-12-07','','','1319 – Biotechnologie alimentaire'],
['Examen 1314 – matin','2026-12-14','','','1314 – Enzymologie et métabolisme'],
['Examen 1317 – 16 h','2026-12-14','16:00','17:30','1317 – Physiologie cellulaire'],
['Examen 1316 – 16 h','2026-12-15','16:00','17:30','1316 – Microbiologie'],
['Examen 1318 – matin','2026-12-15','','','1318 – Physiologie végétale'],
['Examen 1319','2026-12-16','','','1319 – Biotechnologie alimentaire'],
['Examen TEDS – après-midi','2026-12-17','','','TEDS']
];
const todayISO=()=>{let d=new Date();return localDate(d)};
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)};
const startWeek=s=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return localDate(d)};
const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const uid=()=>Math.random().toString(36).slice(2,10);
let data=load();
function load(){try{let x=JSON.parse(localStorage.getItem('rosePlanner'));if(x&&x.tasks)return x}catch(e){}return {tasks:EXAMS.map(e=>({id:uid(),title:e[0],date:e[1],start:e[2],end:e[3],category:e[4],priority:'fixed',type:'event',done:false,recurrence:'none'})),goals:GOALS,history:{},exceptions:{}}}
function save(){localStorage.setItem('rosePlanner',JSON.stringify(data))}
let view='day',selected=todayISO(),monthCursor=new Date(selected+'T12:00:00');
document.getElementById('headerDate').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
function catColor(c){return COLORS[Math.max(0,CATS.indexOf(c))%COLORS.length]}
function taskOccurs(t,date){if(t.recurrence==='none')return t.date===date;if(date<t.date)return false;let diff=Math.round((new Date(date+'T12:00:00')-new Date(t.date+'T12:00:00'))/86400000);if(t.recurrence==='daily')return true;if(t.recurrence==='weekly')return diff%7===0;if(t.recurrence==='weekdays')return new Date(date+'T12:00:00').getDay()%6!==0;if(t.recurrence==='monthly')return new Date(date+'T12:00:00').getDate()===new Date(t.date+'T12:00:00').getDate();return false}
function occurrences(date){return data.tasks.filter(t=>taskOccurs(t,date)).map(t=>({...t,occurrenceDate:date,instanceId:t.recurrence==='none'?t.id:t.id+'_'+date,done:t.recurrence==='none'?t.done:!!(data.exceptions[t.id+'_'+date]&&data.exceptions[t.id+'_'+date].done)})).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function setDone(id,date,checked){let t=data.tasks.find(x=>x.id===id);if(!t)return;if(t.recurrence==='none')t.done=checked;else{data.exceptions[id+'_'+date]={...(data.exceptions[id+'_'+date]||{}),done:checked}}save();render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let a=document.getElementById('app');if(view==='day')a.innerHTML=dayView();if(view==='week')a.innerHTML=weekView();if(view==='month')a.innerHTML=monthView();if(view==='year')a.innerHTML=yearView();if(view==='review')a.innerHTML=reviewView();if(view==='goals')a.innerHTML=goalsView()}
function dayView(){let tasks=occurrences(selected),done=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;return `<div class="row"><div><div class="heading">Ma journée</div><div class="muted">${fmt(selected)}</div></div><input style="width:auto" type="date" value="${selected}" onchange="selected=this.value;render()"></div><div class="card"><div class="stats"><div class="stat"><strong>${tasks.length}</strong><span>À faire aujourd'hui</span></div><div class="stat"><strong>${done}</strong><span>Terminées</span></div><div class="stat"><strong>${pct}%</strong><span>Progression</span></div></div><div style="margin-top:14px" class="progress"><i style="width:${pct}%"></i></div></div><div class="row"><div class="heading">Planning horaire</div><button class="btn small secondary" onclick="openTask('${selected}')">＋ Activité</button></div><div class="card"><div class="timeline">${tasks.length?tasks.map(t=>`<div class="slot"><time>${t.start||'Horaire à définir'} ${t.end?'– '+t.end:''}</time><div class="event" style="border-color:${catColor(t.category)}"><div class="row"><span class="taskname">${esc(t.title)}</span><button class="btn small ghost" onclick="editTask('${t.id}','${selected}')">Modifier</button></div><small>${esc(t.category)} · ${priorityLabel(t.priority)}</small></div></div>`).join(''):'<div class="muted">Aucune activité programmée. Ajoute une tâche ou un événement.</div>'}</div></div><div class="row"><div class="heading">Mes objectifs du jour</div><span class="muted">${tasks.filter(t=>!t.done).length} restante(s)</span></div><div class="card">${tasks.length?tasks.map(t=>taskRow(t,selected)).join(''):'<p class="muted">Ta liste est vide pour le moment.</p>'}</div>`}
function taskRow(t,date){return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="setDone('${t.id}','${date}',this.checked)"><div><div class="taskname">${esc(t.title)}</div><div class="taskmeta"><span class="pill" style="background:${catColor(t.category)}22;color:${catColor(t.category)}">${esc(t.category)}</span><span class="pill ${'priority-'+t.priority}">${priorityLabel(t.priority)}</span>${t.start||'Sans horaire'} ${t.recurrence!=='none'?'· récurrent':''}</div></div><button class="btn small ghost" onclick="editTask('${t.id}','${date}')">⋯</button></div>`}
function weekView(){let s=startWeek(selected),days=Array.from({length:7},(_,i)=>addDays(s,i));let rows=GOALS.map(g=>{let r=realized(g,days[0],days[6]);return `<div class="listline"><span>${esc(g.name)}</span><b>${r.toFixed(1)} h / ${g.hours} h</b></div>`}).join('');return `<div class="row"><div><div class="heading">Ma semaine</div><div class="muted">${fmt(days[0])} – ${fmt(days[6])}</div></div><div><button class="btn small secondary" onclick="selected=addDays(selected,-7);render()">‹</button> <button class="btn small secondary" onclick="selected=addDays(selected,7);render()">›</button></div></div><div style="margin:10px 0 14px"><button class="btn secondary" onclick="openWeekSetup('${days[0]}')">＋ Nouvelle semaine / saisir mes cours</button></div><div class="weekdays">${days.map(d=>`<div class="weekcol"><b>${new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</b>${occurrences(d).map(t=>`<div class="weekitem" style="border-left:3px solid ${catColor(t.category)}" onclick="selected='${d}';view='day';render()">${t.start||''} ${esc(t.title)}</div>`).join('')}</div>`).join('')}</div><div class="card"><div class="row"><b>Objectifs hebdomadaires</b><span class="muted">heures validées uniquement</span></div>${rows}</div><div class="card"><div class="row"><b>Bilan de la semaine</b><button class="btn small" onclick="view='review';render()">Voir le bilan</button></div><p class="muted">Les heures ne sont comptées que lorsque tu coches une séance terminée.</p></div>`}
function monthView(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<offset;i++)cells.push('<div class="daycell out"></div>');for(let n=1;n<=days;n++){let d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),ts=occurrences(d);cells.push(`<div class="daycell ${d===selected?'selected':''}" onclick="selected='${d}';view='day';render()"><div class="daynum">${n}</div>${ts.slice(0,2).map(t=>`<span class="dot" style="background:${catColor(t.category)}"></span>`).join('')}<div class="daylabel">${ts.length?esc(ts[0].title):''}</div>${ts.length>1?`<div class="daylabel">+${ts.length-1}</div>`:''}</div>`)}return `<div class="row"><div><div class="heading">Mon mois</div><div class="muted">Calendrier et échéances</div></div><div><button class="btn small secondary" onclick="changeMonth(-1)">‹</button> <button class="btn small secondary" onclick="changeMonth(1)">›</button></div></div><div class="card"><div class="row"><b>${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><span class="muted">Appuie sur un jour</span></div><div class="gridcal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div></div><div class="card"><b>Progression mensuelle</b>${GOALS.map(g=>{let a=localDate(new Date(y,m,1)),b=localDate(new Date(y,m+1,0)),r=realized(g,a,b),target=g.hours*4.33,p=Math.min(100,Math.round(r/target*100));return `<div style="margin-top:12px"><div class="row"><span>${esc(g.name)}</span><small>${r.toFixed(1)} h / ${target.toFixed(1)} h</small></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join('')}</div>`}
function changeMonth(n){monthCursor.setMonth(monthCursor.getMonth()+n);render()}
function yearView(){let y=new Date(selected+'T12:00:00').getFullYear();return `<div class="row"><div><div class="heading">Mon année</div><div class="muted">${y} · vue d'ensemble</div></div><button class="btn small secondary" onclick="selected=(+selected.slice(0,4)+1)+'-01-01';render()">Année suivante</button></div><div class="gridcal">${Array.from({length:12},(_,m)=>`<div class="card" style="padding:10px;cursor:pointer" onclick="monthCursor=new Date(${y},${m},1);view='month';render()"><b>${new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long'})}</b><div class="muted">${data.tasks.filter(t=>t.date.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length} événement(s)</div></div>`).join('')}</div><div class="card"><b>Échéances à venir</b>${data.tasks.filter(t=>t.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="listline"><span>${esc(t.title)}</span><b>${new Date(t.date+'T12:00:00').toLocaleDateString('fr-FR')}</b></div>`).join('')}</div>`}
function realized(g,a,b){let total=0;for(let d=a;d<=b;d=addDays(d,1)){occurrences(d).filter(t=>t.done&&t.category===g.name).forEach(t=>total+=duration(t))}return total}
function duration(t){if(!t.start||!t.end)return 0;let [h,m]=t.start.split(':').map(Number),[h2,m2]=t.end.split(':').map(Number);return Math.max(0,(h2*60+m2-h*60-m)/60)}
function reviewView(){let s=startWeek(selected),e=addDays(s,6),all=[];for(let d=s;d<=e;d=addDays(d,1))all.push(...occurrences(d));let done=all.filter(t=>t.done),planned=all.reduce((x,t)=>x+duration(t),0),actual=done.reduce((x,t)=>x+duration(t),0),pct=planned?Math.round(actual/planned*100):0;let lines=GOALS.map(g=>{let p=all.filter(t=>t.category===g.name),h=p.reduce((x,t)=>x+duration(t),0),r=p.filter(t=>t.done).reduce((x,t)=>x+duration(t),0),pc=h?Math.round(r/h*100):0;return `<div style="margin:12px 0"><div class="row"><b>${esc(g.name)}</b><span class="muted">${r.toFixed(1)} h / ${h.toFixed(1)} h · ${pc}%</span></div><div class="progress"><i style="width:${pc}%"></i></div><small class="muted">${p.filter(t=>!t.done).length} séance(s) non validée(s)</small></div>`}).join('');let summary=GOALS.map(g=>{let h=realized(g,s,e);return h>=g.hours?`${g.name} : objectif atteint (${h.toFixed(1)} h).`:`${g.name} : ${h.toFixed(1)} h réalisées sur ${g.hours} h visées.`}).join('<br>');return `<div class="heading">Bilan de la semaine</div><div class="row"><span class="muted">${fmt(s)} – ${fmt(e)}</span><div><button class="btn small secondary" onclick="selected=addDays(selected,-7);render()">‹</button> <button class="btn small secondary" onclick="selected=addDays(selected,7);render()">›</button></div></div><div class="card"><div class="stats"><div class="stat"><strong>${planned.toFixed(1)} h</strong><span>Programmées</span></div><div class="stat"><strong>${actual.toFixed(1)} h</strong><span>Effectuées</span></div><div class="stat"><strong>${pct}%</strong><span>Réalisation horaire</span></div></div><p class="muted">${done.length} tâche(s) terminée(s) · ${all.length-done.length} non terminée(s)</p></div><div class="card"><b>Objectifs par matière</b>${lines}</div><div class="card"><b>Résumé factuel</b><p class="muted">${summary}</p></div><div class="card"><b>Tâches non réalisées</b>${all.filter(t=>!t.done).map(t=>`<div class="listline"><span>${esc(t.title)}<small class="muted"> · ${t.date}</small></span><button class="btn small secondary" onclick="reschedule('${t.id}','${t.occurrenceDate}')">Reporter</button></div>`).join('')||'<p class="muted">Tout est validé pour cette semaine.</p>'}</div><button class="btn secondary" onclick="saveHistory('${s}')">Archiver ce bilan</button><div class="card"><b>Bilans archivés</b>${Object.keys(data.history).sort().reverse().map(k=>`<div class="listline"><span>Semaine du ${k}</span><b>${data.history[k].pct}%</b></div>`).join('')||'<p class="muted">Aucun bilan archivé.</p>'}</div>`}
function goalsView(){return `<div class="heading">Mes objectifs</div><p class="muted">Objectifs hebdomadaires. Les heures sont calculées à partir des séances cochées et minutées.</p><div class="card">${data.goals.map(g=>`<div class="listline"><span>${esc(g.name)}<small class="muted" style="display:block">${g.until?'Échéance : '+g.until:''}</small></span><b>${g.hours} h / semaine</b></div>`).join('')}</div><button class="btn" onclick="addGoal()">＋ Ajouter un objectif</button><div class="card"><b>À savoir</b><p class="muted">Les objectifs servent de repères. Pour comptabiliser du temps réellement effectué, crée une séance avec une heure de début et de fin puis coche-la une fois terminée.</p></div>`}
function priorityLabel(p){return p==='fixed'?'Obligatoire':p==='important'?'Important':'Facultatif'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function openWeekSetup(weekStart){
 document.getElementById('sheet').innerHTML=`<h2>Préparer ma semaine ♡</h2>
 <p class="muted">Ajoute les cours connus pour cette semaine. Ils seront enregistrés à leurs dates exactes sans modifier les semaines précédentes.</p>
 <div id="courseRows"></div>
 <button class="btn secondary" onclick="addCourseRow('${weekStart}')">＋ Ajouter un cours</button>
 <div class="sheet-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveWeekCourses()">Enregistrer les cours</button></div>`;
 document.getElementById('modal').classList.add('open');
 addCourseRow(weekStart);
}
function addCourseRow(weekStart){
 let wrap=document.getElementById('courseRows');
 let days=Array.from({length:7},(_,i)=>{let d=addDays(weekStart,i);return `<option value="${d}">${new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})}</option>`}).join('');
 let div=document.createElement('div');div.className='card';div.style.padding='12px';
 div.innerHTML=`<div class="field"><label>Jour</label><select class="courseDate">${days}</select></div>
 <div class="field"><label>Intitulé du cours</label><input class="courseTitle" placeholder="Ex. Physiologie végétale"></div>
 <div class="row"><div class="field" style="flex:1"><label>Début</label><input class="courseStart" type="time"></div><div class="field" style="flex:1"><label>Fin</label><input class="courseEnd" type="time"></div></div>
 <div class="field"><label>Lieu / note (facultatif)</label><input class="courseNote" placeholder="Ex. Amphi, salle…"></div>
 <button class="btn small danger" onclick="this.parentElement.remove()">Retirer cette ligne</button>`;
 wrap.appendChild(div);
}
function saveWeekCourses(){
 let rows=[...document.querySelectorAll('#courseRows .card')],added=0;
 for(let r of rows){
  let title=r.querySelector('.courseTitle').value.trim(),date=r.querySelector('.courseDate').value,start=r.querySelector('.courseStart').value,end=r.querySelector('.courseEnd').value,note=r.querySelector('.courseNote').value.trim();
  if(!title)continue;
  data.tasks.push({id:uid(),title:note?title+' · '+note:title,date,start,end,category:'Cours supplémentaires',priority:'fixed',type:'course',done:false,recurrence:'none'});
  added++;
 }
 if(!added){alert('Ajoute au moins un cours avec un intitulé.');return}
 save();closeModal();render();
}

function openTask(date=selected){editTask(null,date)}
function editTask(id,date){let t=data.tasks.find(x=>x.id===id)||{title:'',date,start:'',end:'',category:CATS[7],priority:'important',type:'task',done:false,recurrence:'none'};document.getElementById('sheet').innerHTML=`<h2>${id?'Modifier l’activité':'Nouvelle activité'}</h2><div class="field"><label>Nom</label><input id="fTitle" value="${esc(t.title)}" placeholder="Ex. Réviser le chapitre 2"></div><div class="field"><label>Date</label><input id="fDate" type="date" value="${date||t.date}"></div><div class="row"><div class="field" style="flex:1"><label>Début</label><input id="fStart" type="time" value="${t.start||''}"></div><div class="field" style="flex:1"><label>Fin</label><input id="fEnd" type="time" value="${t.end||''}"></div></div><div class="field"><label>Catégorie</label><select id="fCat">${CATS.map(c=>`<option ${c===t.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Priorité</label><select id="fPriority"><option value="fixed" ${t.priority==='fixed'?'selected':''}>Obligatoire</option><option value="important" ${t.priority==='important'?'selected':''}>Important</option><option value="optional" ${t.priority==='optional'?'selected':''}>Facultatif</option></select></div><div class="field"><label>Récurrence</label><select id="fRec"><option value="none">Aucune</option><option value="daily" ${t.recurrence==='daily'?'selected':''}>Tous les jours</option><option value="weekdays" ${t.recurrence==='weekdays'?'selected':''}>Jours de semaine</option><option value="weekly" ${t.recurrence==='weekly'?'selected':''}>Chaque semaine</option><option value="monthly" ${t.recurrence==='monthly'?'selected':''}>Chaque mois</option></select></div><div class="checks"><label><input id="fDone" type="checkbox" ${t.done?'checked':''}> Déjà effectuée</label></div><div class="sheet-actions">${id?`<button class="btn danger" onclick="deleteTask('${id}')">Supprimer</button>`:''}<button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveTask('${id||''}')">Enregistrer</button></div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveTask(id){let title=document.getElementById('fTitle').value.trim(),date=document.getElementById('fDate').value;if(!title||!date){alert('Ajoute au minimum un nom et une date.');return}let obj={id:id||uid(),title,date,start:document.getElementById('fStart').value,end:document.getElementById('fEnd').value,category:document.getElementById('fCat').value,priority:document.getElementById('fPriority').value,recurrence:document.getElementById('fRec').value,type:'task',done:document.getElementById('fDone').checked};if(id){let i=data.tasks.findIndex(t=>t.id===id);data.tasks[i]=obj}else data.tasks.push(obj);save();closeModal();render()}
function deleteTask(id){if(confirm('Supprimer cette activité ?')){data.tasks=data.tasks.filter(t=>t.id!==id);save();closeModal();render()}}
function reschedule(id,occDate){let t=data.tasks.find(x=>x.id===id);if(!t)return;let d=prompt('Nouvelle date (AAAA-MM-JJ) :',addDays(occDate,1));if(!d)return;if(t.recurrence!=='none'&&occDate!==t.date){data.tasks.push({...t,id:uid(),date:d,recurrence:'none',done:false});data.exceptions[id+'_'+occDate]={...(data.exceptions[id+'_'+occDate]||{}),skip:true}}else{t.date=d;t.done=false}save();render()}
function saveHistory(s){let e=addDays(s,6),all=[];for(let d=s;d<=e;d=addDays(d,1))all.push(...occurrences(d));let p=all.reduce((a,t)=>a+duration(t),0),r=all.filter(t=>t.done).reduce((a,t)=>a+duration(t),0);data.history[s]={pct:p?Math.round(r/p*100):0,planned:p,actual:r,done:all.filter(t=>t.done).length,total:all.length};save();render();alert('Bilan archivé.')}
function addGoal(){let name=prompt('Nom de l’objectif :');if(!name)return;let h=Number(prompt('Combien d’heures par semaine ?', '2'));if(!h||h<0)return;data.goals.push({id:uid(),name,hours:h});save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rose-planner-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
// Import d'emploi du temps par photo : OCR effectué dans le navigateur, sans envoyer l'image à ChatGPT.
function openPhotoImport(){
 document.getElementById('sheet').innerHTML=`<h2>Importer mon emploi du temps ♡</h2>
 <p class="muted">Choisis une photo ou une capture d'écran nette. La reconnaissance se fait dans ton navigateur. Tu pourras corriger chaque cours avant de l'ajouter.</p>
 <div class="field"><label>Premier jour de la semaine à importer</label><input id="photoWeek" type="date" value="${startWeek(selected)}"></div>
 <div class="card"><b>Conseil pour la photo</b><p class="muted">Privilégie une image droite, bien éclairée, avec les jours, les horaires et les matières lisibles.</p></div>
 <div class="card"><b>Choisir depuis mon iPad</b><p class="muted">Appuie sur le bouton ci-dessous. Si iOS affiche plusieurs choix, sélectionne « Photothèque » ou « Photos » pour une image, et non « Parcourir ».</p></div><div class="sheet-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="document.getElementById('photoFile').click()">Ouvrir ma photothèque</button></div>`;
 document.getElementById('modal').classList.add('open');
}
async function readSchedulePhoto(e){
 const file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file)return;
 const week=document.getElementById('photoWeek')?.value||startWeek(selected);
 document.getElementById('sheet').innerHTML=`<h2>Lecture de la photo ♡</h2><p class="muted">Reconnaissance du texte en cours… Cela peut prendre un petit moment lors du premier usage.</p><div class="progress"><i style="width:45%"></i></div>`;
 try{
  if(!window.Tesseract){await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Impossible de charger le moteur de lecture. Vérifie ta connexion internet.'));document.head.appendChild(sc)})}
  const result=await Tesseract.recognize(file,'fra',{logger:m=>{if(m.status==='recognizing text'){let pct=Math.round((m.progress||0)*100);let bar=document.querySelector('#sheet .progress i');if(bar)bar.style.width=pct+'%'}}});
  showOcrReview(result.data.text,week);
 }catch(err){document.getElementById('sheet').innerHTML=`<h2>Lecture impossible</h2><p class="muted">${esc(err.message||'La photo n’a pas pu être lue.')}</p><div class="sheet-actions"><button class="btn" onclick="openPhotoImport()">Réessayer</button></div>`}
}
function showOcrReview(text,week){
 const lines=text.split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
 const timeRe=/([01]?\d|2[0-3])\s*[hH:.]\s*([0-5]?\d)?\s*(?:-|–|à|a|—)\s*([01]?\d|2[0-3])\s*[hH:.]\s*([0-5]?\d)?/;
 const days=[['lundi',0],['mardi',1],['mercredi',2],['jeudi',3],['vendredi',4],['samedi',5],['dimanche',6]];
 let rows=[];
 lines.forEach(line=>{let m=line.match(timeRe);if(!m)return;let title=line.replace(m[0],' ').replace(/[|•·]/g,' ').trim();if(title.length<2)title='Cours à préciser';let lower=line.toLowerCase();let day=days.find(d=>lower.includes(d[0]));rows.push({title,start:String(m[1]).padStart(2,'0')+':'+String(m[2]||'00').padStart(2,'0'),end:String(m[3]).padStart(2,'0')+':'+String(m[4]||'00').padStart(2,'0'),date:addDays(week,day?day[1]:0)})});
 if(!rows.length){document.getElementById('sheet').innerHTML=`<h2>Texte reconnu ♡</h2><p class="muted">Je n’ai pas réussi à repérer automatiquement les créneaux horaires. Tu peux quand même utiliser le texte reconnu pour saisir tes cours manuellement.</p><textarea id="ocrRaw" rows="8">${esc(text)}</textarea><div class="sheet-actions"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="openWeekSetup('${week}')">Saisir les cours</button></div>`;return}
 const dayOpts=Array.from({length:7},(_,i)=>{let d=addDays(week,i);return `<option value="${d}">${new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})}</option>`}).join('');
 document.getElementById('sheet').innerHTML=`<h2>Vérifier les cours détectés ♡</h2><p class="muted">${rows.length} créneau(x) repéré(s). La lecture d’une grille peut mélanger les matières ou les jours : vérifie et corrige chaque ligne avant validation.</p><div id="ocrRows">${rows.map((r,i)=>`<div class="card ocrrow" style="padding:12px"><div class="field"><label>Matière / activité</label><input class="ocrTitle" value="${esc(r.title)}"></div><div class="field"><label>Jour</label><select class="ocrDate">${dayOpts.replace(`value="${r.date}"`,`value="${r.date}" selected`)}</select></div><div class="row"><div class="field" style="flex:1"><label>Début</label><input class="ocrStart" type="time" value="${r.start}"></div><div class="field" style="flex:1"><label>Fin</label><input class="ocrEnd" type="time" value="${r.end}"></div></div><button class="btn small danger" onclick="this.closest('.ocrrow').remove()">Retirer</button></div>`).join('')}</div><div class="sheet-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveOcrCourses()">Ajouter à mon planning</button></div>`;
 document.getElementById('modal').classList.add('open');
}
function saveOcrCourses(){let rows=[...document.querySelectorAll('#ocrRows .ocrrow')],added=0;for(let r of rows){let title=r.querySelector('.ocrTitle').value.trim(),date=r.querySelector('.ocrDate').value,start=r.querySelector('.ocrStart').value,end=r.querySelector('.ocrEnd').value;if(!title||!date)continue;data.tasks.push({id:uid(),title,date,start,end,category:'Cours supplémentaires',priority:'fixed',type:'course',done:false,recurrence:'none'});added++}if(!added){alert('Aucun cours valide à ajouter.');return}save();closeModal();view='week';render();alert(`${added} cours ajouté(s) à ton planning.`)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tasks||!x.goals)throw 0;data=x;save();render();alert('Sauvegarde importée.')}catch(_){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
render();
</script>
</body></html>
